name: CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr != '' && format('PR firmware #{0} @ {1}{2}{3}', inputs.pr, inputs.commit, inputs.validation == 'target' && ' (target)' || '', inputs.profile != '' && inputs.profile != 'standard' && format(' [profile: {0}]', inputs.profile) || '') || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Existing profile in the exact PR commit (nonstandard requires pr/commit)
        default: standard
        type: string
      validation:
        description: Full validation, or target-only firmware for hardware iteration (requires pr/commit)
        default: full
        type: choice
        options: [full, target]
      pr:
        description: Optional PR number for an exact revision build
        default: ''
        type: string
      commit:
        description: Full commit SHA reachable from that PR head (required with pr)
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ inputs.pr != '' && format('pr-{0}-{1}-{2}-{3}', inputs.pr, inputs.commit, inputs.validation || 'full', inputs.profile || 'standard') || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  revision:
    name: Resolve requested PR revision
    if: github.event_name == 'workflow_dispatch' && (inputs.pr != '' || inputs.commit != '' || inputs.validation == 'target' || (inputs.profile != '' && inputs.profile != 'standard'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify commit belongs to PR history
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          PR_COMMIT: ${{ inputs.commit }}
          PR_PROFILE: ${{ inputs.profile || 'standard' }}
        run: |
          test -n "$PR_COMMIT"
          sha=$(python3 tools/fm1_pr.py "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --commit "$PR_COMMIT" --profile "$PR_PROFILE" --resolve-only)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  stage:
    name: Select feedback stage
    needs: revision
    if: ${{ !cancelled() && (needs.revision.result == 'success' || needs.revision.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify draft feedback without granting acceptance
        id: stage
        run: python3 tools/ci_changes.py
  firmware:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Manual {0}', inputs.validation || 'full') || 'firmware' }}
    needs: [revision, stage]
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.stage.outputs.stage != 'quick' && (needs.revision.result == 'success' || needs.revision.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.revision.outputs.sha }}
      verified_pr: ${{ needs.revision.result == 'success' && inputs.pr || '' }}
      validation: ${{ inputs.validation || 'full' }}
      profile: ${{ inputs.profile || 'standard' }}
  draft-feedback:
    name: Draft feedback
    needs: [revision, stage]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft && needs.stage.result == 'success' && needs.stage.outputs.stage == 'quick' }}
    uses: ./.github/workflows/build.yml
    with:
      validation: quick
      draft_feedback: true
