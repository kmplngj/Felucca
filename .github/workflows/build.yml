# SPDX-License-Identifier: GPL-3.0-only
name: Firmware validation

on:
  workflow_call:
    inputs:
      profile:
        description: Engine profile; nonstandard requires a verified manual PR revision
        default: standard
        type: string
      validation:
        description: full, target-only for a verified manual PR revision, or draft quick feedback
        default: full
        type: string
      draft_feedback:
        description: Explicit partial feedback for a classified draft PR; never merge acceptance
        default: false
        type: boolean
      source_ref:
        description: Verified exact PR commit; empty keeps normal event checkout
        default: ''
        type: string
      verified_pr:
        description: PR number verified by the calling revision job
        default: ''
        type: string
      version:
        description: Empty for development, otherwise the build.py release version
        default: ''
        type: string
    outputs:
      version:
        value: ${{ jobs.validation.outputs.version }}

permissions:
  contents: read
  actions: read

env:
  FELUCCA_PROFILE: ${{ inputs.profile }}

defaults:
  run:
    shell: bash

jobs:
  workflow-checks:
    name: Workflow and CI helper checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      python: ${{ steps.changes.outputs.python }}
      backup: ${{ steps.changes.outputs.backup }}
      emulator: ${{ steps.changes.outputs.emulator }}
      stage: ${{ steps.changes.outputs.stage }}
      focus: ${{ steps.changes.outputs.focus }}
      matrix: ${{ steps.changes.outputs.matrix }}
      sharded: ${{ inputs.validation == 'full' && steps.changes.outputs.full == 'true' && steps.changes.outputs.matrix != '' }}
    steps:
      - name: Validate requested scope
        env:
          VALIDATION: ${{ inputs.validation }}
          SOURCE_REF: ${{ inputs.source_ref }}
          VERIFIED_PR: ${{ inputs.verified_pr }}
          VERSION: ${{ inputs.version }}
          DRAFT_FEEDBACK: ${{ inputs.draft_feedback }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          python3 - <<'PY'
          import os, re
          scope = os.environ['VALIDATION']
          if scope not in ('full', 'target', 'quick'):
              raise SystemExit('Unknown validation scope')
          if scope == 'quick' and (os.environ['GITHUB_EVENT_NAME'] != 'pull_request' or
              os.environ['DRAFT_FEEDBACK'] != 'true' or os.environ['PR_DRAFT'] != 'true' or os.environ['VERSION']):
              raise SystemExit('Quick feedback requires a classified draft PR and no release version')
          profile = os.environ.get('FELUCCA_PROFILE', 'standard')
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', profile):
              raise SystemExit('Invalid engine profile name')
          if (scope == 'target' or profile != 'standard') and (
              os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or os.environ['VERSION'] or
              not re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_REF']) or
              not re.fullmatch(r'[1-9][0-9]*', os.environ['VERIFIED_PR'])
          ):
              raise SystemExit('Target-only scope or nonstandard profile requires a verified manual PR revision and no release version')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Validate profile in selected sources
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd()
          if (root / 'profiles/catalog.json').is_file():
              import sys
              sys.path.insert(0, str(root / 'tools'))
              import profile
              profile.validate_selection(root, os.environ['FELUCCA_PROFILE'])
          elif os.environ['FELUCCA_PROFILE'] != 'standard':
              raise SystemExit('Selected sources do not support engine profiles')
          PY
      - name: Select validation from complete change range
        id: changes
        env:
          RELEASE_VALIDATION: ${{ inputs.version != '' }}
        run: |
          set -o pipefail
          mkdir -p build/ci
          args=()
          if [ "$RELEASE_VALIDATION" = true ]; then args+=(--release); fi
          python3 tools/ci_changes.py "${args[@]}" | tee build/ci/selection.json
          if [ '${{ inputs.validation }}' = quick ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('build/ci/selection.json').read_text())
          if plan['stage'] != 'quick' or not plan['focus']:
              raise SystemExit('Selected changes require complete validation')
          PY
          fi
      - name: Validate workflows and CI failure cases
        run: |
          set -o pipefail
          mkdir -p build/ci
          curl -fL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" 2>&1 | tee build/ci/actionlint.log
          python3 -m unittest discover -s tests -p ci_test.py -v 2>&1 | tee build/ci/helper-tests.log
          if [ -f tests/coverage_contract_test.py ]; then
            python3 tests/coverage_contract_test.py -v 2>&1 | tee build/ci/coverage-helper-tests.log
            python3 tests/test_jobs_test.py -v 2>&1 | tee build/ci/scheduler-helper-tests.log
          fi
          if [ -f tests/ci_target_test.py ]; then
            python3 -m unittest discover -s tests -p ci_target_test.py -v 2>&1 | tee build/ci/target-helper-tests.log
          else
            echo 'Historical sources predate target helper fixtures; the workflow scope guard still runs.' | tee build/ci/target-helper-tests.log
          fi
          python3 tests/source_archive_test.py -v 2>&1 | tee build/ci/source-tests.log
          python3 -m unittest discover -s tests -p ci_changes_test.py -v 2>&1 | tee build/ci/selection-tests.log
          if [ -f tests/ci_reuse_test.py ]; then
            python3 -m unittest discover -s tests -p ci_reuse_test.py -v 2>&1 | tee build/ci/reuse-tests.log
          fi
          python3 -m unittest discover -s tests -p branch_cleanup_test.py -v 2>&1 | tee build/ci/branch-cleanup-tests.log
          python3 -m unittest discover -s tests -p pages_test.py -v 2>&1 | tee build/ci/pages-tests.log
      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-checks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: build/ci/
  python-checks:
    name: Portable Python tests
    needs: workflow-checks
    if: needs.workflow-checks.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run portable fixtures without firmware outputs
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/felucca-python
        run: |
          set -o pipefail
          mkdir -p build/ci
          uv sync --locked --only-group build --python "$(command -v python3)" --no-python-downloads
          export PATH="$UV_PROJECT_ENVIRONMENT/bin:$PATH"
          python3 tools/ci.py portable-tests 2>&1 | tee build/ci/portable-tests.log
      - name: Upload Python diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-checks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: build/ci/
  backup-checks:
    name: Web backup tests
    needs: workflow-checks
    if: needs.workflow-checks.outputs.backup == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Match prior standalone backup evidence
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci
          if python3 tools/ci_reuse.py snapshot --job backup-checks --out build/ci/backup-snapshot.json; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('build/ci/backup-snapshot.json').read_text())['fingerprint']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('fingerprint=' + value + '\n')
          PY
            python3 tools/ci_reuse.py restore --snapshot build/ci/backup-snapshot.json --directory build/ci/backup-reused
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run standalone backup protocol fixtures
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -o pipefail
          mkdir -p build/ci
          node web/test_backup.mjs 2>&1 | tee build/ci/backup-tests.log
      - name: Record fresh standalone backup evidence
        if: steps.reuse.outputs.reused != 'true' && steps.reuse.outputs.fingerprint != ''
        run: |
          mkdir -p build/ci/backup-receipt
          python3 tools/ci_reuse.py record --snapshot build/ci/backup-snapshot.json --evidence build/ci/backup-tests.log --out build/ci/backup-receipt/receipt.json
          cp build/ci/backup-tests.log build/ci/backup-receipt/backup-tests.log
      - name: Publish fresh standalone backup receipt
        if: steps.reuse.outputs.reused != 'true' && steps.reuse.outputs.fingerprint != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-receipt-${{ steps.reuse.outputs.fingerprint }}
          retention-days: 14
          overwrite: true
          if-no-files-found: error
          path: build/ci/backup-receipt/
      - name: Explain reused backup evidence
        if: steps.reuse.outputs.reused == 'true'
        env:
          SOURCE_URL: ${{ steps.reuse.outputs.source_url }}
          SOURCE_REVISION: ${{ steps.reuse.outputs.source_revision }}
        run: |
          echo '### Reused standalone backup validation' >> "$GITHUB_STEP_SUMMARY"
          echo "Original evidence: $SOURCE_URL at $SOURCE_REVISION. All fingerprinted inputs match; no firmware evidence is reused." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-checks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: build/ci/
  emulator-checks:
    name: Browser emulator tests
    needs: workflow-checks
    if: needs.workflow-checks.outputs.emulator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/emu/package-lock.json
      - name: Cache Emscripten
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72-6.0.11-v1
      - name: Install pinned generation and emulator dependencies
        env:
          EMSDK: ${{ runner.temp }}/emsdk
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/felucca-python
        run: |
          mkdir -p build/ci
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang libfribidi0 libraqm0
          uv sync --locked --only-group build --python "$(command -v python3)" --no-python-downloads
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          if [ ! -d "$EMSDK/.git" ]; then
            git init "$EMSDK"
            git -C "$EMSDK" remote add origin https://github.com/emscripten-core/emsdk.git
            git -C "$EMSDK" fetch --depth 1 origin dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
            git -C "$EMSDK" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$EMSDK" rev-parse HEAD)" = dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
          git -C "$EMSDK" diff --exit-code
          git -C "$EMSDK" diff --cached --exit-code
          "$EMSDK/emsdk" install 6.0.11
          "$EMSDK/emsdk" activate 6.0.11
      - name: Cache Playwright browser downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/emu/package-lock.json') }}
      - name: Install pinned browser test dependencies
        run: |
          npm ci --prefix web/emu --ignore-scripts --no-audit --no-fund
          npm exec --prefix web/emu -- playwright install --with-deps --only-shell chromium
      - name: Generate fresh assets and compare native with WASM
        env:
          EMSDK: ${{ runner.temp }}/emsdk
        run: |
          set -o pipefail
          source "$EMSDK/emsdk_env.sh"
          python3 tools/ci.py emulator-tests 2>&1 | tee build/ci/emulator-tests.log
          npm test --prefix web/emu
          git diff --exit-code
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-checks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            build/ci/
            build/emu/
            build/host/emu_native.f32
            build/browser/
  full-browser-checks:
    name: Full browser UI and audio validation
    needs: workflow-checks
    if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      FELUCCA_VERIFIED_PR: ${{ inputs.verified_pr }}
      FELUCCA_VERIFIED_COMMIT: ${{ inputs.source_ref }}
    steps:
      - name: Check out workflow-owned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Preserve locked generation dependencies outside PR sources
        run: |
          mkdir -p "$RUNNER_TEMP/felucca-python-project"
          cp pyproject.toml uv.lock .python-version "$RUNNER_TEMP/felucca-python-project/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Check full browser prerequisites
        run: |
          if [ ! -f web/emu/package.json ] || [ ! -f web/emu/package-lock.json ]; then
            echo 'Full validation requires the browser harness in the selected sources. Rebase onto current sources, use a compatible workflow, or select --validation target when supported.' >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
          working-directory: ${{ runner.temp }}/felucca-python-project
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/emu/package-lock.json
      - name: Cache Emscripten
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72-6.0.11-v1
      - name: Install pinned generation and emulator dependencies
        env:
          EMSDK: ${{ runner.temp }}/emsdk
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/felucca-python
        run: |
          mkdir -p build/ci
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang libfribidi0 libraqm0
          uv sync --locked --only-group build --project "$RUNNER_TEMP/felucca-python-project" --python "$(command -v python3)" --no-python-downloads
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
          if [ ! -d "$EMSDK/.git" ]; then
            git init "$EMSDK"
            git -C "$EMSDK" remote add origin https://github.com/emscripten-core/emsdk.git
            git -C "$EMSDK" fetch --depth 1 origin dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
            git -C "$EMSDK" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$EMSDK" rev-parse HEAD)" = dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
          git -C "$EMSDK" diff --exit-code
          git -C "$EMSDK" diff --cached --exit-code
          "$EMSDK/emsdk" install 6.0.11
          "$EMSDK/emsdk" activate 6.0.11
      - name: Cache Playwright browser downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/emu/package-lock.json') }}
      - name: Install pinned browser test dependencies
        run: |
          npm ci --prefix web/emu --ignore-scripts --no-audit --no-fund
          npm exec --prefix web/emu -- playwright install --with-deps --only-shell chromium
      - name: Record browser checkout and dependency provenance
        env:
          EMSDK: ${{ runner.temp }}/emsdk
        run: |
          source "$EMSDK/emsdk_env.sh"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${VERSION#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            git show -s --format=fuller HEAD
            echo "Engine profile: $FELUCCA_PROFILE; release version: $VERSION"
            git submodule status --recursive
            test -z "$(git submodule status --recursive | grep -E '^[+U-]' || true)"
            git submodule foreach --recursive 'git diff --exit-code && git diff --cached --exit-code'
            sha256sum "$RUNNER_TEMP/felucca-python-project/uv.lock" web/emu/package-lock.json
            python3 --version
            clang --version
            node --version
            git -C "$EMSDK" rev-parse HEAD
            "$EMSDK/upstream/emscripten/emcc" --version
          } > build/ci/browser-provenance.txt
      - name: Build fresh emulator and run browser UI and audio checks
        env:
          EMSDK: ${{ runner.temp }}/emsdk
        run: |
          set -o pipefail
          source "$EMSDK/emsdk_env.sh"
          # Use the longstanding generation API rather than a newer ci.py command:
          # verified historical PR sources can still provide their own emulator.
          python3 - <<'PYGEN' 2>&1 | tee build/ci/browser-assets.log
          import os, sys
          sys.path.insert(0, 'tools')
          import build
          release = os.environ.get('VERSION')
          build.VERSION = build.resolve(['--release', release] if release else [])['version']
          build.generate()
          PYGEN
          sh web/emu/build.sh 2>&1 | tee build/ci/emulator-build.log
          npm test --prefix web/emu
          git diff --exit-code
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-browser-checks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            build/ci/
            build/emu/
            build/build-identity.json
            build/profile-contract.json
            build/gen/resolved-profile.json
            build/browser/
  build:
    name: Target, host and emulator
    needs: [workflow-checks, python-checks, backup-checks, emulator-checks, validation, full-browser-checks]
    # Run after failed dependencies, but stop when the workflow is canceled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang
      SANITIZE: '1'
      TEST_JOBS: '4'
      JOBS: '1'
      VERSION: ${{ needs.validation.outputs.version }}
      FELUCCA_VERIFIED_PR: ${{ inputs.verified_pr }}
      FELUCCA_VERIFIED_COMMIT: ${{ inputs.source_ref }}
    steps:
      - name: Check selected validation results
        env:
          FULL_SELECTED: ${{ needs.workflow-checks.outputs.full }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSER_SELECTED: ${{ needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full' }}
          BROWSER_RESULT: ${{ needs.full-browser-checks.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-checks.result }}
          PYTHON_SELECTED: ${{ needs.workflow-checks.outputs.python }}
          PYTHON_RESULT: ${{ needs.python-checks.result }}
          BACKUP_SELECTED: ${{ needs.workflow-checks.outputs.backup }}
          BACKUP_RESULT: ${{ needs.backup-checks.result }}
          EMULATOR_SELECTED: ${{ needs.workflow-checks.outputs.emulator }}
          EMULATOR_RESULT: ${{ needs.emulator-checks.result }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['WORKFLOW_RESULT'] != 'success':
              raise SystemExit('Workflow/selection checks did not succeed')
          for suite in ('PYTHON', 'BACKUP', 'EMULATOR', 'BROWSER'):
              expected = 'success' if os.environ[suite + '_SELECTED'] == 'true' else 'skipped'
              if os.environ[suite + '_RESULT'] != expected:
                  raise SystemExit(suite + ' validation did not complete as selected')
          expected = 'success' if os.environ['FULL_SELECTED'] == 'true' else 'skipped'
          if os.environ['VALIDATION_RESULT'] != expected:
              raise SystemExit('Target/host validation did not complete as selected')
          PY
      - name: Check out exact sources for combined host verification
        if: needs.workflow-checks.outputs.sharded == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.workflow-checks.outputs.sharded == 'true'
        with:
          python-version: '3.12'
      - name: Install matching host verifier compiler
        if: needs.workflow-checks.outputs.sharded == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang
      - name: Restore exact generated host inputs
        if: needs.workflow-checks.outputs.sharded == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/gen
      - name: Download both complete host receipts
        if: needs.workflow-checks.outputs.sharded == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/host-shards
      - name: Verify complete source-derived host coverage across both runners
        if: needs.workflow-checks.outputs.sharded == 'true'
        env:
          COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/sdk"
          export DAISYSP="$RUNNER_TEMP/DaisySP"
          python3 tools/test_coverage.py verify-shards --cohort "$COHORT" "$RUNNER_TEMP"/host-shards/host-shard-*
      - name: Explain partial draft feedback
        if: inputs.validation == 'quick'
        run: |
          echo '### Draft feedback only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Focused tests are not merge acceptance. Mark the PR ready to run the required firmware checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Download candidate firmware after all selected gates pass
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation != 'quick'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-firmware-${{ inputs.validation == 'target' && 'target-' || '' }}${{ inputs.profile != 'standard' && format('{0}-', inputs.profile) || '' }}${{ github.run_id }}
          path: ${{ runner.temp }}/validated-firmware
      - name: Upload validated firmware
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation != 'quick'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ inputs.validation == 'target' && 'target-' || '' }}${{ inputs.profile != 'standard' && format('{0}-', inputs.profile) || '' }}${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/validated-firmware/
      - name: Download candidate release after all selected gates pass
        if: needs.workflow-checks.outputs.full == 'true' && inputs.version != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-release-${{ github.run_id }}
          path: ${{ runner.temp }}/validated-release
      - name: Upload validated release
        if: needs.workflow-checks.outputs.full == 'true' && inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/validated-release/

  validation:
    name: Target and host validation (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: workflow-checks
    if: needs.workflow-checks.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.validation == 'full' && needs.workflow-checks.outputs.matrix || '{"include":[{"shard":1,"total":1}]}') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
      VALIDATION: ${{ inputs.validation }}
      FELUCCA_VERIFIED_PR: ${{ inputs.verified_pr }}
      FELUCCA_VERIFIED_COMMIT: ${{ inputs.source_ref }}
      CC: clang
      SANITIZE: '1'
      TEST_JOBS: '4'
      JOBS: '1'
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ matrix.total }}
      COHORT: ${{ github.run_id }}-${{ github.run_attempt }}
      FOCUS_UNITS: ${{ needs.workflow-checks.outputs.focus }}
    steps:
      - name: Check out workflow orchestration
        if: needs.workflow-checks.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Preserve orchestration and locked dependencies outside PR sources
        if: needs.workflow-checks.outputs.full == 'true'
        run: |
          cp tools/ci_target.py "$RUNNER_TEMP/felucca-ci-target.py"
          mkdir -p "$RUNNER_TEMP/felucca-python-project"
          cp pyproject.toml uv.lock .python-version "$RUNNER_TEMP/felucca-python-project/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.workflow-checks.outputs.full == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Validate version and record checkout
        if: needs.workflow-checks.outputs.full == 'true'
        id: version
        run: |
          mkdir -p build/ci
          git show -s --format=fuller HEAD > build/ci/checkout.txt
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${VERSION#v}"; fi
          if [ -n "$VERSION" ]; then python3 tools/ci.py version "$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          target_cache_key=$(python3 "$RUNNER_TEMP/felucca-ci-target.py" cache-key)
          test -n "$target_cache_key"
          echo "target_cache_key=$target_cache_key" >> "$GITHUB_OUTPUT"
          {
            echo "JIELI_TOOLCHAIN=$RUNNER_TEMP/jieli/toolchain"
            echo "AC79_SDK=$RUNNER_TEMP/sdk"
            echo "DAISYSP=$RUNNER_TEMP/DaisySP"
            echo "EMSDK=$RUNNER_TEMP/emsdk"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.workflow-checks.outputs.full == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.workflow-checks.outputs.full == 'true'
        with:
          version: '0.12.23'
          enable-cache: true
          working-directory: ${{ runner.temp }}/felucca-python-project
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/emu/package-lock.json
      - name: Install pinned image-generation dependencies
        if: needs.workflow-checks.outputs.full == 'true'
        env:
          # Keep dependencies outside both Git sources and verified source archives.
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/felucca-python
        run: |
          sudo apt-get update -q
          packages=(libfribidi0 libraqm0)
          if [ "$VALIDATION" = full ]; then packages+=(clang); fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          # Use workflow-owned pins even when the selected PR predates uv.
          uv sync --locked --only-group build --project "$RUNNER_TEMP/felucca-python-project" \
            --python "$(command -v python3)" --no-python-downloads
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "PYTHON=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_ENV"
      - name: Cache target inputs
        if: needs.workflow-checks.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/jieli
            ${{ runner.temp }}/sdk
          key: target-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.target_cache_key }}
      - name: Fetch and verify target inputs
        if: needs.workflow-checks.outputs.full == 'true'
        run: |
          set -o pipefail
          {
            if [ ! -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang" ]; then
              sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
            fi
            python3 tools/ci.py sdk
          } 2>&1 | tee build/ci/dependencies.log
      - name: Cache Emscripten
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72-6.0.11-v1
      - name: Cache DaisySP reference sources
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DaisySP
          key: daisysp-${{ runner.os }}-${{ runner.arch }}-2c72eaf9eac5fc0dca1919d65d606da907832618-v1
      - name: Pin Emscripten and DaisySP reference sources
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full'
        run: |
          set -o pipefail
          {
            if [ ! -d "$EMSDK/.git" ]; then
              git init "$EMSDK"
              git -C "$EMSDK" remote add origin https://github.com/emscripten-core/emsdk.git
              git -C "$EMSDK" fetch --depth 1 origin dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
              git -C "$EMSDK" checkout --detach FETCH_HEAD
            fi
            test "$(git -C "$EMSDK" rev-parse HEAD)" = dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
            git -C "$EMSDK" diff --exit-code
            git -C "$EMSDK" diff --cached --exit-code
            "$EMSDK/emsdk" install 6.0.11
            "$EMSDK/emsdk" activate 6.0.11
            source "$EMSDK/emsdk_env.sh"
            echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
            echo "EM_CONFIG=$EMSDK/.emscripten" >> "$GITHUB_ENV"
            if [ ! -d "$DAISYSP/.git" ]; then
              git init "$DAISYSP"
              git -C "$DAISYSP" remote add origin https://github.com/electro-smith/DaisySP.git
              git -C "$DAISYSP" fetch --depth 1 origin 2c72eaf9eac5fc0dca1919d65d606da907832618
              git -C "$DAISYSP" checkout --detach FETCH_HEAD
            fi
            test "$(git -C "$DAISYSP" rev-parse HEAD)" = 2c72eaf9eac5fc0dca1919d65d606da907832618
            test -z "$(git -C "$DAISYSP" status --porcelain)"
          } 2>&1 | tee build/ci/reference-dependencies.log
      - name: Check prerequisites and capture provenance
        if: needs.workflow-checks.outputs.full == 'true'
        run: |
          set -o pipefail
          if [ "$VALIDATION" != full ]; then
            python3 "$RUNNER_TEMP/felucca-ci-target.py" preflight 2>&1 | tee build/ci/preflight.log
            python3 "$RUNNER_TEMP/felucca-ci-target.py" provenance 2>&1 | tee build/ci/provenance.log
          else
            python3 tools/ci.py preflight 2>&1 | tee build/ci/preflight.log
            python3 tools/ci.py provenance 2>&1 | tee build/ci/provenance.log
          fi
      - name: Target build and resource guards
        if: needs.workflow-checks.outputs.full == 'true'
        run: |
          set -o pipefail
          ulimit -n 8192
          if [ -n "$VERSION" ]; then
            ./build.sh --release "$VERSION" 2>&1 | tee build/ci/build.log
            cp "build/felucca-$VERSION.fwsc" build/felucca.fwsc
          else
            ./build.sh 2>&1 | tee build/ci/build.log
          fi
          test -s build/felucca.dis
          if [ -f tools/build_report.py ]; then
            python3 tools/build_report.py --verify build/resource-report.json
          fi
      - name: Target instruction budget and package validation
        if: needs.workflow-checks.outputs.full == 'true'
        run: |
          set -o pipefail
          python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt 2>&1 | tee build/ci/target-budget.log
          python3 "$RUNNER_TEMP/felucca-ci-target.py" package --validation "${VALIDATION/quick/target}" 2>&1 | tee build/ci/package.log
          git diff --exit-code
      - name: Host, sanitizer, web and emulator tests
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full'
        run: |
          set -o pipefail
          export FELUCCA_COVERAGE_REPORT="$PWD/build/ci/coverage.json"
          FELUCCA_COVERAGE_ID="$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          export FELUCCA_COVERAGE_ID
          if [ "$SHARD_TOTAL" = 2 ]; then
            # Both receipts bind the same prerequisite Wasm bytes, regardless of
            # which shard owns the emulator parity unit.
            sh web/emu/build.sh 2>&1 | tee build/ci/host-wasm-prerequisite.log
            python3 tests/test_jobs.py tests/run_tests.sh --preflight --shard "$SHARD_INDEX/$SHARD_TOTAL" --cohort "$COHORT" 2>&1 | tee build/ci/tests.log
          else
            # Historical exact-PR sources retain their complete original runner.
            sh tests/run_tests.sh 2>&1 | tee build/ci/tests.log
            python3 tools/ci.py verify-tests build/ci/tests.log
          fi
      - name: Focused draft feedback (not merge acceptance)
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'quick'
        run: |
          set -o pipefail
          python3 tests/test_jobs.py tests/run_tests.sh --preflight --select "$FOCUS_UNITS" 2>&1 | tee build/ci/feedback.log
      - name: Preserve generated inputs for aggregate verification
        if: needs.workflow-checks.outputs.sharded == 'true' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-generated-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: build/gen/
      - name: Locate the unique host shard receipt
        if: always() && needs.workflow-checks.outputs.sharded == 'true'
        id: host-receipt
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          receipts = list(Path('build/host').glob('test-run-*'))
          if len(receipts) > 1:
              raise SystemExit('Ambiguous host receipts')
          if receipts:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('path=' + str(receipts[0]) + '\n')
          PY
      - name: Preserve host shard receipt and outputs
        if: always() && needs.workflow-checks.outputs.sharded == 'true' && steps.host-receipt.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ steps.host-receipt.outputs.path }}/
      - name: Prepare MACRO device acceptance projects and MIDI
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full' && inputs.profile == 'macro' && matrix.shard == 1
        run: |
          if [ -f tools/macro_device_pack.py ]; then
            python3 tools/macro_device_pack.py --out build/macro-device-pack
          else
            echo 'Selected revision predates the optional MACRO device pack; firmware validation continues.'
          fi
      - name: Reproduce package from a clean checkout
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full' && matrix.shard == 1
        run: |
          set -o pipefail
          # Local clone preserves this exact PR merge/tag commit and tracked sample assets.
          git clone --no-local --recurse-submodules . "$RUNNER_TEMP/reproduce"
          (
            cd "$RUNNER_TEMP/reproduce"
            if [ -n "$VERSION" ]; then ./build.sh --release "$VERSION"; else ./build.sh; fi
          ) 2>&1 | tee build/ci/reproduce.log
          package=felucca.fwsc
          if [ "$FELUCCA_PROFILE" != standard ]; then package="felucca-$FELUCCA_PROFILE.fwsc"; fi
          if [ -n "$VERSION" ]; then package="felucca-$VERSION.fwsc"; fi
          cmp "build/$package" "$RUNNER_TEMP/reproduce/build/$package"
          sha256sum "build/$package" | tee build/ci/package.sha256
          git diff --exit-code
      - name: Verify and archive release bundle
        if: needs.workflow-checks.outputs.full == 'true' && inputs.version != '' && matrix.shard == 1
        run: |
          python3 tools/ci.py finalize "$VERSION"
          (
            cd "$RUNNER_TEMP/reproduce"
            python3 tools/ci.py provenance
            python3 tools/ci.py finalize "$VERSION"
          )
          cmp "build/felucca-$VERSION-release.tar.gz" "$RUNNER_TEMP/reproduce/build/felucca-$VERSION-release.tar.gz"
          cmp "build/felucca-$VERSION-source.tar.gz" "$RUNNER_TEMP/reproduce/build/felucca-$VERSION-source.tar.gz"
          # Build complete extracted source without Git or any submodule download.
          mkdir "$RUNNER_TEMP/source-reproduce"
          tar -xzf "build/felucca-$VERSION-source.tar.gz" -C "$RUNNER_TEMP/source-reproduce"
          (
            cd "$RUNNER_TEMP/source-reproduce/felucca-$VERSION-source"
            python3 tools/source_archive.py verify .
            ./build.sh --release "$VERSION"
          ) 2>&1 | tee build/ci/source-reproduce.log
          cmp "build/felucca-$VERSION.fwsc" "$RUNNER_TEMP/source-reproduce/felucca-$VERSION-source/build/felucca-$VERSION.fwsc"
      - name: Check out the pinned WebApp fork for main-site builds
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full' && inputs.verified_pr == '' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kmplngj/Felucca-WebApp
          ref: a881cb73ae66730f6c2a6bff14a2f170e09d7690 # WebApp #15: deterministic WATCH test fixture (merged)
          path: build/pages/webapp
          persist-credentials: false
      - name: Validate the editor and stage the fork site
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full' && inputs.verified_pr == '' && github.ref == 'refs/heads/main' && matrix.shard == 1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          webapp="$GITHUB_WORKSPACE/build/pages/webapp"
          # Standalone WebApp suites use their own mock firmware revision. Keep the
          # checkout separate from web/'s legacy relative host-fixture paths;
          # the final catalog suite explicitly exercises this firmware's C harness.
          (
            cd "$webapp"
            node test_app.mjs
            node test_web.mjs
            FELUCCA_PROTO=app node test_web.mjs
            node test_backup.mjs
            node test_project_import.mjs
            FELUCCA_ROOT="$GITHUB_WORKSPACE" node test_legacy.mjs
            FELUCCA_ROOT="$GITHUB_WORKSPACE" node test_catalog.mjs
          ) 2>&1 | tee build/ci/pages-webapp-tests.log
          python3 tools/pages.py stage "$webapp" build/site
      - name: Upload the tested fork site
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation == 'full' && inputs.verified_pr == '' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.run_id }}
          path: build/site/
          retention-days: 30
          if-no-files-found: error
      - name: Upload diagnostics, including failed runs
        if: always() && needs.workflow-checks.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/ci/
            build/*.elf
            build/*.dis
            build/*.dis.profile.json
            build/*.map
            build/*.sym
            build/loader/*.elf
            build/loader/*.dis
            build/host/*.wav
            build/host/test-run-*/
            build/stress/
            build/browser/
            build/host/asan/*.log
            build/ui_new/**/*.png
            build/ui_fm4/**/*.png
            build/reverb_demo/*.wav
            build/fm6_demo/*.wav
      - name: Stage candidate firmware
        if: needs.workflow-checks.outputs.full == 'true' && inputs.validation != 'quick' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-firmware-${{ inputs.validation == 'target' && 'target-' || '' }}${{ inputs.profile != 'standard' && format('{0}-', inputs.profile) || '' }}${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/felucca*.fwsc
            build/felucca.bin
            build/ci/provenance.json
            build/build-identity.json
            build/profile-contract.json
            build/resource-report.json
            build/gen/resolved-profile.json
            build/ci/package.sha256
            build/macro-device-pack/
            LICENSE
            LICENSING.md
            LICENSES/
            assets/samples-cc0/ATTRIBUTION.txt
      - name: Stage candidate release
        if: needs.workflow-checks.outputs.full == 'true' && inputs.version != '' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-release-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/release-${{ env.VERSION }}/
            build/felucca-${{ env.VERSION }}-release.tar.gz
            build/felucca-${{ env.VERSION }}-release.tar.gz.sha256
            build/felucca-${{ env.VERSION }}-source.tar.gz
            build/felucca-${{ env.VERSION }}-source.tar.gz.sha256
      - name: Summarize validation and limits
        if: always()
        run: |
          {
            echo '### Felucca firmware validation'
            echo "Result: ${{ job.status }}. Diagnostics retain available outputs for 14 days."
            echo "Engine profile: $FELUCCA_PROFILE."
            echo "Validation scope: ${VALIDATION:-full}. Firmware build selected: ${{ needs.workflow-checks.outputs.full }}."
          if [ "$VALIDATION" = target ]; then
              echo 'TARGET ONLY: build/resource/loader guards, static target budgets and package integrity. Host, sanitizer, browser/emulator and reproducibility tests were omitted; full PR validation is still required.'
          elif [ "$VALIDATION" = quick ]; then
            echo 'DRAFT FEEDBACK ONLY: focused host tests and fresh target guards. This run cannot satisfy the firmware merge checks.'
            fi
          echo "Host shard: $SHARD_INDEX/$SHARD_TOTAL. Complete sharded coverage is established only by the final required aggregate."
            echo 'Known independent inputs use focused checks; docs/review-only changes complete this check without building firmware. Selection details are in the workflow-checks summary and diagnostics.'
            echo 'The full scope retains target/resource guards, host goldens and engine switches, ASan/UBSan fuzz, DaisySP, web, native/WASM comparison and package reproducibility.'
            echo 'Host CPU budgets require available counters and matching host/compiler baselines; ns/sample is informational. Target budgets are static estimates. FM-1 audio deadlines, USB/MIDI, panel behavior and flashing remain device checks.'
            if [ -f build/ci/tests.log ]; then
              echo ''
              if [ -f tools/test_coverage.py ]; then
                echo 'Structured host coverage (required by this selected source):'
                echo '```text'
                if [ -f build/ci/coverage.json ]; then
                  python3 tools/test_coverage.py summary build/ci/coverage.json
                else
                  echo 'No structured report produced; full coverage is incomplete.'
                fi
                echo '```'
              else
                echo 'Historical selected source: legacy transcript verifier; no structured coverage qualification.'
              fi
              echo 'Host CPU evidence, allowed fixture skips and FX coverage (both regression builds):'
              echo '```text'
              grep -E '^== CPU baselines:|^regress: CPU counter:|^regress: CPU: .*the budget is not checked|^regress: [0-9]+ golden renders.*CPU (budget not checked|entries over budget)|^official V15 restore: skipped|^FX rest' build/ci/tests.log || true
              if ! grep -Eq '^FX rest: (SKIP|FAIL:)|^FX rest Os: [0-9]+ audio/state matches;' build/ci/tests.log; then
                echo 'FX rest: pending coverage (#153; no completed regression outcome in this run)'
              fi
              echo '```'
            fi
            echo 'Tagged publication is separate from this read-only build job.'
          } >> "$GITHUB_STEP_SUMMARY"
