# SPDX-License-Identifier: GPL-3.0-only
name: Merged branch cleanup

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete verified merged branches (otherwise dry-run)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # Scheduled runs use default-branch code. Other refs may only audit, so PR
    # implementation can be verified remotely before it merges.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test cleanup safety
        run: python3 -m unittest discover -s tests -p branch_cleanup_test.py -v
      - name: Audit or delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          TRUSTED_REF: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then
            if [ "$TRUSTED_REF" != true ]; then
              echo 'Apply requires a run from the default branch.' >&2
              exit 1
            fi
            args+=(--apply)
          fi
          python3 tools/branch_cleanup.py --repo "$REPOSITORY" "${args[@]}" --report build/branch-cleanup/audit.json
      - name: Upload audit, including partial cleanup on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: build/branch-cleanup/audit.json
