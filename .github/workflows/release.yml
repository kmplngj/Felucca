# SPDX-License-Identifier: GPL-3.0-only
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate; publication requires selecting its vVERSION tag
        required: true
        type: string

      publish:
        description: Publish the tested tag after completing docs/releases.md
        default: false
        type: boolean
      tested_commit:
        description: Full tagged commit SHA tested with the versioned package
        default: ''
        type: string
      tested_package_sha256:
        description: SHA-256 of the exact versioned .fwsc tested on the FM-1
        default: ''
        type: string
      hardware_tested:
        description: I completed the FM-1 release checklist for this exact package
        default: false
        type: boolean
      test_evidence:
        description: HTTPS test report (package SHA256, setup, results and known limitations)
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check explicit exact-tag test attestation before publication
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          TESTED_PACKAGE_SHA256: ${{ inputs.tested_package_sha256 }}
          HARDWARE_TESTED: ${{ inputs.hardware_tested }}
          TEST_EVIDENCE: ${{ inputs.test_evidence }}
        run: python3 tools/release_notes.py approve
  validate:
    needs: approval
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      TEST_EVIDENCE: ${{ inputs.test_evidence }}
      CHANNEL: stable
      TESTED_PACKAGE_SHA256: ${{ inputs.tested_package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.run_id }}
          path: downloaded
      - name: Verify downloaded firmware and complete source bundles and publish
        shell: bash
        run: |
          set -euo pipefail
          # Upload paths share build/ as their root, preserving release-VERSION/.
          mv "downloaded/release-$VERSION" release
          # Staging verifies both archives, source pins and all license/checksum assets.
          python3 tools/ci.py stage-release "$VERSION"
          (cd release-assets && sha256sum -c SHA256SUMS)
          # Publish only bytes matching the package actually tested on hardware.
          python3 tools/release_notes.py verify-tested-package
          # Preserve an existing release and its assets. Never silently replace a package.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if printf '%s\n' "$existing" | grep -Fxq "$GITHUB_REF_NAME"; then
            echo '::notice::Release already exists; no assets were replaced.'
            exit 0
          fi
          python3 tools/release_notes.py notes
          args=(--verify-tag --notes-file release-notes.md --title "Felucca $VERSION")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" "${args[@]}" release-assets/*
