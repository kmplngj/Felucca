# SPDX-License-Identifier: GPL-3.0-only
name: Maintainer verified bundle
run-name: Maintainer bundle ${{ inputs.profile }} @ ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full lowercase SHA of the current main workflow/source commit
        required: true
        type: string
      profile:
        description: Existing canonical profile; no feature overrides
        required: true
        default: standard
        type: choice
        options: [standard, reduced-lofi, macro]

permissions:
  contents: read

concurrency:
  group: maintainer-bundle-${{ inputs.revision }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  bundle:
    if: github.repository == 'kmplngj/Felucca' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUESTED_REVISION: ${{ inputs.revision }}
      REQUESTED_PROFILE: ${{ inputs.profile }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # The input revision never controls checkout or a fetched ref. Dispatch on
      # main selects both trusted orchestration and the only allowlisted source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Admit the exact main revision and canonical recipe
        run: >-
          python3 tools/maintainer_bundle.py plan --mode workflow
          --revision "$REQUESTED_REVISION" --profile "$REQUESTED_PROFILE"
          --output build/maintainer-bundle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Prepare existing native and simulator prerequisites
        env:
          JIELI_TOOLCHAIN: ${{ runner.temp }}/jieli/toolchain
          AC79_SDK: ${{ runner.temp }}/sdk
          EMSDK: ${{ runner.temp }}/emsdk
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/felucca-python
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang libfribidi0 libraqm0
          uv sync --locked --only-group build --python "$(command -v python3)" --no-python-downloads
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          echo "JIELI_TOOLCHAIN=$JIELI_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "AC79_SDK=$AC79_SDK" >> "$GITHUB_ENV"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          python3 tools/ci.py sdk
          git init "$EMSDK"
          git -C "$EMSDK" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$EMSDK" fetch --depth 1 origin dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
          git -C "$EMSDK" checkout --detach FETCH_HEAD
          test "$(git -C "$EMSDK" rev-parse HEAD)" = dd8e25632640cfc1fb570c7fa4cc374e8a5e5a72
          "$EMSDK/emsdk" install 6.0.11
          "$EMSDK/emsdk" activate 6.0.11
      - name: Build, reproduce, pair and verify before staging
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          python3 tools/maintainer_bundle.py run --mode workflow \
            --revision "$REQUESTED_REVISION" --profile "$REQUESTED_PROFILE" \
            --output build/maintainer-bundle
      - name: Retain only the verified bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintainer-bundle-${{ inputs.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/maintainer-bundle/verified-bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Retain orchestration diagnostics without unverified firmware
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintainer-bundle-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/maintainer-bundle/RESULT.json
            build/maintainer-bundle/logs/
          if-no-files-found: ignore
          retention-days: 14
