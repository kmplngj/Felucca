[project]
name = "felucca-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
build = [
    "Pillow==11.1.0",
    "fonttools==4.66.1",
    "brotli==1.2.0",
]
midi = [
    "mido==1.3.3",
    "python-rtmidi==1.5.8",
]
audit = [
    { include-group = "build" },
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pyloudnorm==0.2.0",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
